{% extends "base.html" %}
{% block title %}{{ _('Configurar administrador') }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ _('Crear el primer administrador') }}</h1>

<form method="post" class="card p-3">
  <div class="mb-3">
    <label class="form-label">{{ _('Token') }}</label>
    <input class="form-control" name="token" required>
  </div>
  <div class="mb-3">
    <label class="form-label">{{ _('Usuario administrador') }}</label>
    <input class="form-control" name="username" autocomplete="username" required>
  </div>
  <div class="mb-3">
    <label class="form-label">{{ _('Contraseña') }}</label>
    <input type="password" class="form-control" name="password" autocomplete="new-password" required>
  </div>
  <div class="mb-3">
    <label class="form-label">{{ _('Confirmar contraseña') }}</label>
    <input type="password" class="form-control" name="password2" autocomplete="new-password" required>
  </div>
  <button class="btn btn-primary">{{ _('Crear administrador') }}</button>
</form>
{% endblock %}
