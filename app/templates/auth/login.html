{% extends "base.html" %}
{% block title %}{{ _('Iniciar sesión') }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ _('Iniciar sesión') }}</h1>

<form method="post" class="card p-3">
  <div class="mb-3">
    <label class="form-label">{{ _('Usuario') }}</label>
    <input class="form-control" name="username" autocomplete="username" required>
  </div>
  <div class="mb-3">
    <label class="form-label">{{ _('Contraseña') }}</label>
    <input type="password" class="form-control" name="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary">{{ _('Entrar') }}</button>
</form>
{% endblock %}
