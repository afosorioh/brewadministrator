{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

  <h2>{{ "Editar producto" if product else "Nuevo producto" }}</h2>

  <form method="post">

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" name="name" class="form-control" required
             value="{{ product.name if product else '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Estilo</label>
      <input type="text" name="style" class="form-control"
             value="{{ product.style if product else '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <textarea name="description" class="form-control">{{ product.description if product else '' }}</textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">Presentación</label>
      <input type="text" name="presentation" class="form-control"
             value="{{ product.presentation if product else 'Lata 330 ml' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Volumen ml</label>
      <input type="number" name="volume_ml" class="form-control"
             value="{{ product.volume_ml if product else 330 }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input type="number" step="0.01" name="price" class="form-control" required
             value="{{ product.price if product else '' }}">
    </div>

    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input type="number" step="0.01" name="stock_quantity" class="form-control"
             value="{{ product.stock_quantity if product else 0 }}">
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" name="active" class="form-check-input" id="active"
             {% if not product or product.active %}checked{% endif %}>
      <label class="form-check-label" for="active">Activo</label>
    </div>

    <button class="btn btn-primary">Guardar</button>
    <a href="{{ url_for('inventario.lista') }}" class="btn btn-secondary">Cancelar</a>

  </form>

</div>
{% endblock %}
